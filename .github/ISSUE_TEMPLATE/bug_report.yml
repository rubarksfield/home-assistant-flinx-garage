name: Bug report
description: Help the garage door feel at home again.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: >-
        Keep emails/passwords, tokens, device keys/IDs, Bluetooth names/addresses,
        IP addresses and household names private. Do not attach captures or full config exports.
  - type: input
    id: version
    attributes:
      label: Integration and Home Assistant versions
      placeholder: "Integration 3.1.1; Home Assistant 2026.9.2"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      options:
        - Cloud only
        - Bluetooth preferred, cloud fallback
        - Cloud preferred, Bluetooth fallback
        - Bluetooth only
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
      description: Include reproducible steps and model/firmware if known; omit identifying labels.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Short reviewed log excerpt (optional)
      description: Remove all personal and device identifiers before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and household/device identifiers from this report.
          required: true
