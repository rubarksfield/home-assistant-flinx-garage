[project]
name = "home-assistant-flinx-garage"
version = "3.1.1"
requires-python = ">=3.14.2"
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.0.0",
    "paho-mqtt>=2.1.0",
    "pycryptodome>=3.19.0",
]

[dependency-groups]
dev = [
    "homeassistant==2026.9.2",
    "aiousbwatcher==1.1.2",
    "serialx==1.10.0",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
    "aiohasupervisor>=0.6.0",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "habluetooth==6.26.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
